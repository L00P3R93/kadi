<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5c542">
    <meta name="robots" content="noindex">
    <title>Offline · Kadi</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            background: #0a0a0a;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(245, 197, 66, 0.12), transparent 60%);
            color: #f5f5f0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        main { max-width: 22rem; }
        img { width: 96px; height: 96px; margin: 0 auto 24px; display: block; }
        h1 {
            margin: 0 0 12px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.75rem;
            letter-spacing: 0.04em;
            color: #f5c542;
        }
        p { margin: 0 0 28px; line-height: 1.6; color: rgba(245, 245, 240, 0.72); }
        button {
            appearance: none;
            border: 0;
            border-radius: 10px;
            padding: 14px 28px;
            font: inherit;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #0a0a0a;
            background: linear-gradient(135deg, #f5c542 0%, #ffde74 50%, #f5c542 100%);
            cursor: pointer;
        }
        button:focus-visible { outline: 3px solid #ffde74; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" width="96" height="96" alt="">
        <h1>You're offline</h1>
        <p>Kadi needs an internet connection to deal you in. Check your connection and try again.</p>
        <button type="button" id="retry">Try again</button>
    </main>
    <script>
        document.getElementById('retry').addEventListener('click', function () { location.reload(); });
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
